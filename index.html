  document.querySelectorAll('[data-i18n]').forEach(function(n){n.innerHTML=d[n.dataset.i18n]});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang)});
  var on=bowl.classList.contains('sq');
  sq.textContent=on?d.sqOff:d.sqOn;sq.setAttribute('aria-pressed',on);hint.textContent=on?d.hintOff:d.hintOn;
  document.title=d.logo+' | Khao Soi';
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}render()}});
function tog(){bowl.classList.toggle('sq');render()}
sq.onclick=tog;document.getElementById('lime').onclick=tog;
render();
})();
</script>
</body>
</html>
